loop_closure:
  queue_capacity: 32

  keyframes:
    translation_m: 0.75
    rotation_deg: 7.5
    minimum_interval_s: 0.4
    maximum_interval_s: 3.0
    minimum_points: 30

  pose_graph:
    prior_rotation_sigma_rad: 1.0e-4
    prior_translation_sigma_m: 1.0e-4
    odometry_rotation_variance_floor: 1.9038589e-5
    odometry_translation_variance_floor: 1.0e-2
    loop_minimum_keyframe_separation: 30
    loop_maximum_initial_translation_error_m: 15.0
    loop_maximum_initial_rotation_error_deg: 60.0
    loop_minimum_initial_nis: 0.0
    loop_maximum_initial_nis: 300.0
    loop_maximum_pose_correction_translation_m: 20.0
    loop_maximum_pose_correction_rotation_deg: 45.0

  shadow_map:
    radius_m: 80.0
    maximum_keyframes: 1000
    maximum_input_points: 3000000

  registration:
    maximum_iterations: 30
    maximum_refresh_attempts: 64
    minimum_effective_points: 30
    maximum_neighbor_distance_m: 2.25
    plane_fit_threshold_m: 0.25
    robust_huber_delta_m: 0.35
    convergence_translation_m: 0.002
    convergence_rotation_deg: 0.05
    minimum_information_eigenvalue: 1.0e-5
    maximum_information_condition: 1.0e10
    maximum_translation_m: 3.0
    maximum_rotation_deg: 25.0

  std_detector:
    minimum_keyframe_separation: 30
    voxel_size_m: 0.5
    minimum_voxel_points: 3
    plane_eigenvalue_ratio: 0.12
    maximum_keypoints: 160
    triangle_neighbor_count: 10
    maximum_triangles: 2000
    maximum_references_per_bucket: 8
    triangle_minimum_side_m: 0.5
    triangle_maximum_side_m: 9.5
    triangle_side_resolution_m: 0.25
    triangle_relative_error: 0.08
    binary_similarity_minimum: 0.18
    minimum_triangle_matches: 4
    maximum_candidates: 16
    maximum_matches_per_candidate: 256
    maximum_ransac_hypotheses: 64
    minimum_ransac_inliers: 4
    ransac_vertex_threshold_m: 0.5
    geometric_overlap_distance_m: 0.5
    geometric_overlap_minimum: 0.12
    refinement_iterations: 8
    required_consistent_detections: 1
    single_detection_overlap_minimum: 0.0
    accepted_loop_cooldown_s: 10.0
    confirmation_translation_m: 1.5
    confirmation_rotation_deg: 15.0
    confirmation_target_id_tolerance: 10
    maximum_pose_distance_m: 20.0
    maximum_prior_translation_error_m: 15.0
    maximum_prior_rotation_error_deg: 60.0
