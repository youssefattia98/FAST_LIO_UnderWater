/**:
  ros__parameters:
    sonar:
      topic: /sonar_point_cloud
      frequency: 4.0
      translation: [0.09382, -0.02148, 0.11593] # m
      rotation: [0.0, 6.0, 0.0] # RPY degrees
      max_range: 15.0
      min_range: 0.2
      xy_covariance: 0.2231011450761961
      z_covariance: 0.2231011450761961
    imu:
      topic: /sonar/imu/data_raw
      frequency: 200.0
      init_gravity_covariance: 1.0e-05
      init_position_covariance: 1.0e-06
      init_attitude_covariance: 1.0e-06
      initial_gravity_estimate: 9.8

      initial_gyroscope_bias: [0.0, 0.0, 0.0]
      gyroscope_covariance: 0.0027757901707411905
      gyroscope_bias_covariance: 6.835184767375685e-07
      init_gyroscope_bias_covariance: 0.0001

      accelerometer_covariance: 0.9234966307904593
      accelerometer_bias_covariance: 0.006826460354750434
      init_accelerometer_bias_covariance: 0.001
      accel_attitude_covariance: 0.0012184697
      accel_attitude_norm_gate: 2.0

      orientation_covariance: 3.0461742e-06

    dvl:
      enable: true
      topic: /auv/dvl
      frequency: 15.0
      translation: [-0.0785, 0.14, -0.11538] # m
      rotation: [0.0, 0.0, 0.0] # RPY degrees
      covariance: 0.01
      init_covariance: 1.0e-09
    pressure:
      enable: true
      topic: /auv/pressure/scaled2
      frequency: 4.0
      translation: [-0.24219, -0.03954, 0.01898] # m
      rotation: [0.0, 0.0, 0.0] # RPY degrees
      fluid_density: 1025.0
      covariance: 40652.529
      init_covariance: 10000.0
    magnetometer:
      enable: false
      topic: /auv/imu/magnetic_field
      frequency: 150.0
      translation: [0.0, 0.0, 0.0] # m
      rotation: [0.0, 0.0, 0.0] # RPY degrees
      hard_iron_offset: [119.84, -49.82, 6.39]
      soft_iron: [-1.022, -1.022, -1.0]
      covariance: 3200.0
    mapping:
      max_iteration: 4
      filter_size_surf: 0.3
      filter_size_map: 0.3
      cube_side_length: 100.0
      world_frame: World
      map_file_path: ./test.pcd
    publish:
      corrected_map_enable: true
      corrected_map_topic: /uwfl2/corrected_map
      corrected_map_point_size: 0.03 # Sphere diameter in metres
      corrected_map_voxel_size: 0.15 # Display-only point spacing in metres
    loop_closure:
      enable: true
      profile: balanced
